version: 1
profiles:
  benchmark_sync:
    remote_execution: forbidden
    credential_requirements: [none]
    completion_model: count
    slot_kind: sync
    queue: benchmark-cases
    triage_mode: fused
    plugins:
      source: inline_source
      normalizer: inline_source
      admission_policy: default_limits
      retry_policy: budget_window
      capacity_policy: lease_pair
      trigger_policy: rubric_v2
      attribution: attribution_none
      dispatch_policy: dispatch_disabled
      fusion: weighted_mean
      aggregation: weighted_mean
      completion_extra: always_true
      report: report_metrics_only
      callback_authenticator: local_only
    execution_plan:
      - phase_id: judge
        role: score
        counts_toward_progress: true
        side_effect_class: read_only
        request_builder: request_builder_passthrough
        execution: exact_match_judge
    rubric:
      score_min: 0
      score_max: 1
      attribution_threshold: 0
      criteria:
        - id: fused
          weight: 1
          counts_toward_progress: true
