version: 1
env: local
keyspace_generation: v2
queue_prefix: local
worker_profile: default
allow_auto_artifact_hash: true
redis_url: redis://127.0.0.1:6380/0
database:
  host: 127.0.0.1
  port: 5433
  user: eval
  name: eval
  secret_ref: database
plugin_signature:
  secret_ref: plugin_trust
object_store_dir: var/reports
slots:
  sync:
    worker_concurrency: 8
    per_node_per_run: 8
    cluster_soft_cap: 0
  judge:
    worker_concurrency: 8
    per_node_per_run: 8
    cluster_soft_cap: 32
  attr:
    worker_concurrency: 4
    per_node_per_run: 4
    cluster_soft_cap: 16
retry:
  max_attempts: 3
  backoff_initial_ms: 20
  backoff_max_ms: 200
  retry_max_duration_ms: 7200000
  callback_timeout_ms: 600000
slot_busy:
  base_ms: 30
  max_probes_per_run: 8
  probe_ttl_s: 30
healer:
  lease_ms: 120000
  renew_ms: 40000
  orphan_grace_ms: 30000
limits:
  max_cases: 5000
  max_case_bytes: 1000000
  replay_case_limit: 500
llm_max_concurrency: 4
instance_max_concurrency: 0
run_max_duration_ms: 86400000
discover_on_catalog_error: fail
