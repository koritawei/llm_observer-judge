server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://stack:8080;
    }
    location /healthz {
        proxy_pass http://stack:8080;
    }
    location /readyz {
        proxy_pass http://stack:8080;
    }
    location /stackz {
        proxy_pass http://stack:8080;
    }
    location /annotation/ {
        proxy_pass http://stack:8080;
    }
    location /benchmark/ {
        proxy_pass http://stack:8080;
    }
    location /dashboard/ {
        proxy_pass http://stack:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
