[circus]
check_delay=5
endpoint=tcp://127.0.0.1:5555
pubsub_endpoint=tcp://127.0.0.1:5556
statsd=true
pidfile=/home/admin/application.pid

[watcher:main]
copy_env=True
copy_path=True
working_dir=/home/admin/bazel-workspace
use_sockets=True
cmd=/home/admin/bazel-workspace/bazel-bin/services/agent-eval/server
stop_signal=SIGTERM
stop_children=True
# Force unbuffered I/O at Python level
env.PYTHONUNBUFFERED=1
# Runtime config — real values come from custom/bin/setenv.sh (copy_env=True) or
# Aone antx.properties. Keep these as the in-container defaults.
env.PORT=8100
stdout_stream.class=FileStream
stdout_stream.filename=/home/admin/agent-eval-service/logs/application.log
stdout_stream.max_bytes=104857600
stdout_stream.time_format=%Y-%m-%d %H:%M:%S
stdout_stream.backup_count=30
stdout_stream.flush_delay=0
stderr_stream.class=FileStream
stderr_stream.filename=/home/admin/agent-eval-service/logs/error.log
stderr_stream.max_bytes=104857600
stderr_stream.backup_count=30
stderr_stream.time_format=%Y-%m-%d %H:%M:%S
stderr_stream.flush_delay=0
