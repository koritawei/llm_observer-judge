[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark"
version = "1.23.0"
requires-python = ">=3.10"
dependencies = [
  "redis>=5.0",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "PyYAML>=6",
  "bullmq>=2.25,<3",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "langgraph>=0.2,<1.1",
  "tortoise-orm>=0.21",
  "aiokafka>=0.11,<1",
  "aiosqlite>=0.20",
  "pydantic>=2",
  "pydantic-settings>=2",
  "json-repair>=0.30",
  "aiolimiter>=1.1",
  "cachetools>=5",
  "apscheduler>=3.10",
  "openpyxl>=3.1",
  "langfuse>=2",
  "anthropic>=0.40",
  "langchain-anthropic>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
benchmark = "benchmark.__main__:main"

[tool.setuptools.packages.find]
include = ["benchmark*", "business*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
markers = [
  "integration: Redis and PostgreSQL started from docker compose",
  "smoke: deployment smoke checks",
]
